name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q clinical_lidar
      - name: Check webapp JavaScript syntax
        run: node --check webapp/app.js
      - name: Run frontend review agent
        run: python tools/frontend_agent/frontend_agent.py audit --json
