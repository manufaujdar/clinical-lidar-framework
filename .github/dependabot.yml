version: 2
updates:
  # Keep GitHub Actions current without changing application behavior.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # The core package has no runtime dependencies. This also watches the
  # optional research manifest if its entries gain version constraints.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
